  <section>
    <form
      class="one-col"
      method="POST"
      action="https://formsubmit.co/your_unique_form_id"
    >

      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        required
      />

      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        required
      />

      <label for="message">Message:</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        cols="30"
      ></textarea>

      <input
        type="submit"
        value="Submit"
      />

    </form>
